# MediaMTX v1.11.3 — Central VMS server konfiguratsiyasi (server REJA §3, root §16.3-16.4).
# Versiya Makefile'da qulflangan: MEDIAMTX_VERSION = v1.11.3 (REJA §2.1/3).
# MUHIM (2026-11-20 tekshirildi): v1.11.3'da `udpReadBufferSize` va
# `readBufferCount` PARAMETRLARI YO'Q (eski versiyalarniki) — UDP buffer
# sozlamasi faqat syscall orqali: net.core.rmem_max (install-notes.md, S4).
# Qulflanadiganlar: auth hook, path patternlari, faqat RTSP+WebRTC+HLS,
# writeQueueSize, pprof/metrics/api.

logLevel: info
logDestinations: [stdout]

# --- Protokollar: faqat RTSP (ingest) + WebRTC (play) + HLS (fallback) ---
rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, tcp]        # H.265 ingest RTSP/TCP; UDP bloklangan joyda agent TCP tanlaydi
rtspAuthMethods: [basic]
webrtc: yes
webrtcAddress: :8889              # WHIP/WHEP (WHEP URL: http://host:8889/<path>/whep)
webrtcLocalUDPAddress: :8189      # ICE UDP porti (vmsd auth-hook TCP 8189 bilan to'qnashmaydi)
webrtcLocalTCPAddress: ""         # UDP afzal; tarmoq testi S2 itest'ida
webrtcAdditionalHosts: [192.168.0.27]   # OPERATOR TO‘LDIRADI: server static IP (root §16.4)
# Bu mashinada enp4s0 = 192.168.0.27: boshqa PC‘dagi brauzer WebRTC ICE
# nomzodi shu manzilni ko‘radi (docker0 172.17.0.1 LAN‘da yetchmaydi).
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency            # LL-HLS fallback (S2: UI'ga hls.js signali)
hlsAlwaysRemux: no
rtmp: no
srt: no
playback: no                      # arxiv playback YO'Q (root §1 talab 6)

# --- Auth: har publish/read vmsd'ga so'rov (protocol.md §15) ---
authMethod: http
authHTTPAddress: http://127.0.0.1:8189/internal/auth
# api/metrics/pprof hook'dan tashqarida: 127.0.0.1 uchun ichki ruxsat
# (default admin qoidasi) yetarli — vmsd control API localhost'dan uranadi.
authHTTPExclude:
- action: api
- action: metrics
- action: pprof

# --- Path patternlari (root §3): cam/{client}/{camera} va tc/{client}/{camera} ---
# Manba faqat publish orqali (hech narsa avtomatik tortilmaydi);
# qat'iy tekshiruvni auth-hook qiladi (token→path→session).
paths:
  "~^cam/.+":
    source: publisher
    record: no
  "~^tc/.+":
    source: publisher
    record: no
  all_others:
    source: publisher
    record: no

# --- Yuk/tuning (root §16.3) ---
writeQueueSize: 1024
udpMaxPayloadSize: 1472
readTimeout: 10s
writeTimeout: 10s

metrics: yes
metricsAddress: 127.0.0.1:9998
pprof: yes
pprofAddress: 127.0.0.1:9999
api: yes
apiAddress: 127.0.0.1:9997        # vmsd control API klienti (S2) — faqat localhost
